<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta charset=" UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho - Fraga Lanches</title>
    <link rel="stylesheet" href="/design-system.css" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0c0c0c" />
    <link rel="icon" href="/assets/images/icons/logo.png" />
  <style>

/* CENTRAL DE NOTIFICAÇÕES */
.fraga-notificacao {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin: 0 12px;
    z-index: 9999;
}

.fraga-sino {
    position: relative;
    width: 42px;
    height: 42px;
    border: 1px solid #333;
    border-radius: 50%;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
    font-size: 21px;
}

.fraga-sino:hover {
    background: #292929;
}

.fraga-contador {
    position: absolute;
    top: -4px;
    right: -5px;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    border-radius: 20px;
    background: #e53935;
    color: white;
    font-size: 10px;
    font-weight: bold;
    display: none;
    align-items: center;
    justify-content: center;
}

.fraga-painel-notificacoes {
    position: absolute;
    top: 50px;
    right: 0;
    width: 340px;
    max-width: calc(100vw - 30px);
    max-height: 420px;
    overflow-y: auto;
    background: #171717;
    color: #fff;
    border: 1px solid #333;
    border-radius: 12px;
    box-shadow: 0 8px 30px #0008;
    display: none;
    z-index: 10000;
}

.fraga-painel-notificacoes.aberto {
    display: block;
}

.fraga-notificacoes-topo {
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #333;
}

.fraga-notificacoes-topo strong {
    font-size: 14px;
}

.fraga-marcar-todas {
    background: none;
    border: none;
    color: #44b7f8;
    cursor: pointer;
    font-size: 11px;
}

.fraga-notificacao-item {
    padding: 13px 15px;
    border-bottom: 1px solid #292929;
    cursor: pointer;
}

.fraga-notificacao-item:hover {
    background: #242424;
}

.fraga-notificacao-item.nao-lida {
    border-left: 3px solid #44b7f8;
    background: #202a30;
}

.fraga-notificacao-item strong {
    display: block;
    font-size: 13px;
    margin-bottom: 5px;
}

.fraga-notificacao-item p {
    font-size: 12px;
    color: #ccc;
    margin: 0 0 6px;
}

.fraga-notificacao-item small {
    font-size: 10px;
    color: #888;
}

.fraga-notificacao-vazia {
    padding: 25px 15px;
    text-align: center;
    color: #999;
    font-size: 13px;
}

@media(max-width: 480px) {
    .fraga-painel-notificacoes {
        position: fixed;
        top: 75px;
        right: 10px;
    }
}

</style>
    <link rel="stylesheet" href="/responsive.css" />
  </head>

  <body>
    <section class="page-header">
      <div class="page-header-inner">
        <h1 class="page-title">SEU <span class="accent">CARRINHO</span></h1>
        <p class="page-subtitle">Revise seus itens e finalize o pedido</p>
        <div class="yellow-line"></div>
      </div>
    </section>

    <main class="carrinho-main">
      <div class="container">
        <div
          class="carrinho-layout"
          style="
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: var(--space-8);
          "
        >
          <section class="carrinho-itens">
            <div id="carrinhoLista"></div>

            <div class="empty-state hidden" id="carrinhoVazio">
              <h2 class="empty-state-title">Carrinho vazio</h2>
              <p class="empty-state-message">
                Adicione produtos do cardápio para começar seu pedido.
              </p>
              <a href="/cliente/cardapio.html" class="btn btn-primary btn-lg">
                Ir ao Cardápio
              </a>
            </div>

            <div
              class="carrinho-acoes hidden"
              id="carrinhoAcoes"
              style="
                display: flex;
                justify-content: space-between;
                margin-top: 24px;
                gap: 12px;
                flex-wrap: wrap;
              "
            >
              <a href="/cliente/cardapio.html" class="btn btn-secondary">
                Continuar Comprando
              </a>

              <button class="btn btn-danger" id="btnLimparCarrinho">
                Limpar Carrinho
              </button>
            </div>
          </section>

          <aside
            class="carrinho-resumo"
            style="position: sticky; top: 100px; height: fit-content"
          >
            <div class="card">
              <div class="card-content">
                <h3 class="card-title">Resumo do Pedido</h3>

                <div class="resumo-linha d-flex justify-between">
                  <span>Subtotal</span>
                  <span id="resumoSubtotal">R$ 0,00</span>
                </div>

                <div class="resumo-linha d-flex justify-between">
                  <span>Taxa de entrega</span>
                  <span id="resumoTaxaEntrega">R$ 0,00</span>
                </div>

                <div class="resumo-linha d-flex justify-between">
                  <span>Desconto</span>
                  <span id="resumoDesconto">R$ 0,00</span>
                </div>

                <div class="resumo-total d-flex justify-between">
                  <strong>Total</strong>
                  <strong id="resumoTotal">R$ 0,00</strong>
                </div>

                <a
                  href="/cliente/checkout.html"
                  class="btn btn-primary btn-block btn-lg"
                  id="btnFinalizar"
                >
                  Finalizar Pedido
                </a>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <script src="/cliente/carrinho.js" defer></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(console.error);
        });
      }
    </script>
  </body>
</html>
