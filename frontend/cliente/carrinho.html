<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta charset=" UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho - Fraga Lanches</title>
    <link rel="stylesheet" href="/design-system.css" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0c0c0c" />
    <link rel="icon" href="/assets/images/icons/logo.png" />
  </head>

  <body>
    <section class="page-header">
      <div class="page-header-inner">
        <h1 class="page-title">SEU <span class="accent">CARRINHO</span></h1>
        <p class="page-subtitle">Revise seus itens e finalize o pedido</p>
        <div class="yellow-line"></div>
      </div>
    </section>

    <main class="carrinho-main">
      <div class="container">
        <div
          class="carrinho-layout"
          style="
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: var(--space-8);
          "
        >
          <section class="carrinho-itens">
            <div id="carrinhoLista"></div>

            <div class="empty-state hidden" id="carrinhoVazio">
              <h2 class="empty-state-title">Carrinho vazio</h2>
              <p class="empty-state-message">
                Adicione produtos do cardápio para começar seu pedido.
              </p>
              <a href="/cliente/cardapio.html" class="btn btn-primary btn-lg">
                Ir ao Cardápio
              </a>
            </div>

            <div
              class="carrinho-acoes hidden"
              id="carrinhoAcoes"
              style="
                display: flex;
                justify-content: space-between;
                margin-top: 24px;
                gap: 12px;
                flex-wrap: wrap;
              "
            >
              <a href="/cliente/cardapio.html" class="btn btn-secondary">
                Continuar Comprando
              </a>

              <button class="btn btn-danger" id="btnLimparCarrinho">
                Limpar Carrinho
              </button>
            </div>
          </section>

          <aside
            class="carrinho-resumo"
            style="position: sticky; top: 100px; height: fit-content"
          >
            <div class="card">
              <div class="card-content">
                <h3 class="card-title">Resumo do Pedido</h3>

                <div class="resumo-linha d-flex justify-between">
                  <span>Subtotal</span>
                  <span id="resumoSubtotal">R$ 0,00</span>
                </div>

                <div class="resumo-linha d-flex justify-between">
                  <span>Taxa de entrega</span>
                  <span id="resumoTaxaEntrega">R$ 0,00</span>
                </div>

                <div class="resumo-linha d-flex justify-between">
                  <span>Desconto</span>
                  <span id="resumoDesconto">R$ 0,00</span>
                </div>

                <div class="resumo-total d-flex justify-between">
                  <strong>Total</strong>
                  <strong id="resumoTotal">R$ 0,00</strong>
                </div>

                <a
                  href="/cliente/checkout.html"
                  class="btn btn-primary btn-block btn-lg"
                  id="btnFinalizar"
                >
                  Finalizar Pedido
                </a>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <script src="/cliente/carrinho.js" defer></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(console.error);
        });
      }
    </script>
  </body>
</html>
