<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Fraga Lanches" />

    <title>Cardápio | Fraga Lanches</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/imagens/logo.png" />
    <link rel="apple-touch-icon" href="/imagens/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/design-system.css" />

    <style>
      /* =====================================================
         FRAGA LANCHES — CARDÁPIO
         Identidade visual: preto, dourado e branco
         ===================================================== */

      :root {
        --cdp-bg: #0c0c0c;
        --cdp-card: #181818;
        --cdp-card-hover: #202020;
        --cdp-border: rgba(255, 255, 255, 0.09);
        --cdp-yellow: #f5c542;
        --cdp-yellow-hover: #ffda65;
        --cdp-text: #f5f5f5;
        --cdp-muted: #a5a5a5;
        --cdp-input: #111111;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        width: 100%;
        max-width: 100%;
        overflow-x: clip;
        scroll-behavior: smooth;
      }

      body {
        display: block;
        width: 100%;
        max-width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        overflow-x: clip;
        background:
          radial-gradient(
            ellipse at 50% 0%,
            rgba(245, 197, 66, 0.09),
            transparent 42%
          ),
          radial-gradient(
            circle at 90% 80%,
            rgba(245, 197, 66, 0.035),
            transparent 35%
          ),
          var(--cdp-bg);
        color: var(--cdp-text);
        font-family: "Montserrat", sans-serif;
      }

      body section {
        position: static;
        min-height: 0;
        height: auto;
      }

      button,
      a,
      input,
      select {
        font: inherit;
      }

      /* =====================================================
         BANNER — ESTABELECIMENTO FECHADO
         ===================================================== */

      .closed-banner {
        width: 100%;
        background: linear-gradient(
          90deg,
          rgba(245, 197, 66, 0.12),
          rgba(255, 107, 107, 0.12)
        );
        border-bottom: 1px solid rgba(245, 197, 66, 0.28);
      }

      .closed-banner.hidden {
        display: none;
      }

      .closed-banner-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        max-width: 1200px;
        margin: 0 auto;
        padding: 13px 20px;
        color: var(--cdp-yellow);
      }

      .closed-banner-text {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .closed-banner-text strong {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .closed-banner-text span {
        color: #e6e6e6;
        font-size: 12px;
      }

      /* =====================================================
         CABEÇALHO
         ===================================================== */

      .page-header {
        display: block;
        width: 100%;
        max-width: 100%;
        min-height: 0;
        margin: 0 auto;
        padding: 24px 24px 22px;
        background: transparent !important;
        border: 0;
        text-align: center;
      }

      .page-header-top {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto 30px;
      }

      .btn-voltar-painel {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 10px 16px;
        border: 1px solid #333333;
        border-radius: 8px;
        background: rgba(24, 24, 24, 0.9);
        color: #dddddd;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-decoration: none;
        transition: 0.2s ease;
      }

      .btn-voltar-painel:hover {
        border-color: var(--cdp-yellow);
        background: rgba(245, 197, 66, 0.08);
        color: var(--cdp-yellow);
        transform: translateY(-2px);
      }

      .page-header-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 920px;
        margin: 0 auto;
        text-align: center;
      }

      .page-title {
        display: block;
        width: 100%;
        margin: 0 0 12px;
        padding: 0;
        color: #ffffff;
        font-family: "Anton", sans-serif;
        font-size: clamp(44px, 6vw, 68px);
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0.045em;
        text-transform: uppercase;
        text-align: center;
      }

      .page-title .accent {
        color: var(--cdp-yellow);
      }

      .page-subtitle {
        display: block;
        width: 100%;
        max-width: 590px;
        margin: 0 auto;
        padding: 0;
        color: #a5a5a5;
        font-size: 13px;
        font-weight: 400;
        line-height: 1.8;
        text-align: center;
      }

      .yellow-line {
        display: block;
        width: 72px;
        height: 3px;
        margin: 19px auto 0;
        border-radius: 999px;
        background: var(--cdp-yellow);
        box-shadow: 0 0 18px rgba(245, 197, 66, 0.3);
      }

      /* =====================================================
         FILTRO DE CATEGORIAS
         ===================================================== */

      .categorias-filtro {
        width: 100%;
        padding: 14px 20px 25px;
      }

      .categorias-filtro .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0;
      }

      .categorias-scroll {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .categorias-scroll button,
      .categorias-scroll .categoria-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 42px;
        padding: 10px 19px;
        border: 1px solid #333333;
        border-radius: 8px;
        background: #181818;
        color: #c8c8c8;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.035em;
        cursor: pointer;
        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease,
          transform 0.2s ease;
      }

      .categorias-scroll button:hover,
      .categorias-scroll .categoria-btn:hover {
        border-color: rgba(245, 197, 66, 0.6);
        background: rgba(245, 197, 66, 0.07);
        color: var(--cdp-yellow);
        transform: translateY(-2px);
      }

      .categorias-scroll button.active,
      .categorias-scroll button[aria-selected="true"],
      .categorias-scroll .categoria-btn.active {
        border-color: var(--cdp-yellow);
        background: var(--cdp-yellow);
        color: #141414;
        font-weight: 800;
        box-shadow: 0 4px 16px rgba(245, 197, 66, 0.13);
      }

      /* =====================================================
         ÁREA PRINCIPAL
         ===================================================== */

      .cardapio-main {
        width: 100%;
        padding: 12px 20px 110px;
      }

      .cardapio-main > .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0;
      }

      .cardapio-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: stretch;
        gap: 24px;
      }

      .cardapio-grid > * {
        min-width: 0;
      }

      /* =====================================================
         CARDS DE PRODUTOS
         ===================================================== */

      .cardapio-grid > article,
      .cardapio-grid > div,
      .cardapio-grid .produto-card,
      .cardapio-grid .card-produto {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 15px;
        min-width: 0;
        padding: 16px;
        overflow: hidden;
        border: 1px solid #303030;
        border-radius: 13px;
        background: linear-gradient(
          145deg,
          #1d1d1d 0%,
          #171717 65%,
          #141414 100%
        );
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
        transition:
          border-color 0.25s ease,
          background 0.25s ease,
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }

      .cardapio-grid > article:hover,
      .cardapio-grid > div:hover,
      .cardapio-grid .produto-card:hover,
      .cardapio-grid .card-produto:hover {
        border-color: rgba(245, 197, 66, 0.55);
        background: linear-gradient(
          145deg,
          #222222 0%,
          #191919 65%,
          #151515 100%
        );
        box-shadow: 0 16px 38px rgba(0, 0, 0, 0.4);
        transform: translateY(-4px);
      }

      .cardapio-grid img {
        display: block;
        width: 100%;
        height: 205px;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.055);
        border-radius: 9px;
        background:
          radial-gradient(
            circle at center,
            rgba(245, 197, 66, 0.055),
            transparent 70%
          ),
          #111111;
        object-fit: contain;
        transition: transform 0.35s ease;
      }

      .cardapio-grid > article:hover img,
      .cardapio-grid > div:hover img,
      .cardapio-grid .produto-card:hover img,
      .cardapio-grid .card-produto:hover img {
        transform: scale(1.025);
      }

      .cardapio-grid h2,
      .cardapio-grid h3 {
        margin: 0;
        color: #ffffff;
        font-family: "Anton", sans-serif;
        font-size: 23px;
        font-weight: 400;
        letter-spacing: 0.035em;
        line-height: 1.2;
        text-transform: uppercase;
      }

      .cardapio-grid p {
        margin: 0;
        color: #a5a5a5;
        font-size: 12px;
        line-height: 1.65;
      }

      .cardapio-grid strong,
      .cardapio-grid .preco,
      .cardapio-grid [class*="preco"] {
        color: var(--cdp-yellow);
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.015em;
      }

      .cardapio-grid button,
      .cardapio-grid .btn,
      .cardapio-grid a[class*="btn"] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 43px;
        margin-top: auto;
        padding: 11px 16px;
        border: 1px solid var(--cdp-yellow);
        border-radius: 8px;
        background: var(--cdp-yellow);
        color: #171717;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.055em;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .cardapio-grid button:hover,
      .cardapio-grid .btn:hover,
      .cardapio-grid a[class*="btn"]:hover {
        border-color: var(--cdp-yellow-hover);
        background: var(--cdp-yellow-hover);
        box-shadow: 0 5px 16px rgba(245, 197, 66, 0.16);
        transform: translateY(-1px);
      }

      .cardapio-grid button:active,
      .cardapio-grid .btn:active {
        transform: scale(0.98);
      }

      /* =====================================================
         ESTADO VAZIO
         ===================================================== */

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-top: 18px;
        padding: 60px 24px;
        border: 1px solid #303030;
        border-radius: 14px;
        background: linear-gradient(145deg, #1c1c1c, #151515);
        text-align: center;
      }

      .empty-state.hidden {
        display: none;
      }

      .empty-state-icon {
        display: inline-flex;
        width: 68px;
        height: 68px;
        align-items: center;
        justify-content: center;
        margin-bottom: 19px;
        border: 1px solid rgba(245, 197, 66, 0.28);
        border-radius: 18px;
        background: rgba(245, 197, 66, 0.09);
        color: var(--cdp-yellow);
      }

      .empty-state-title {
        margin: 0 0 10px;
        color: #ffffff;
        font-family: "Anton", sans-serif;
        font-size: 27px;
        font-weight: 400;
        letter-spacing: 0.035em;
        text-transform: uppercase;
      }

      .empty-state-message {
        max-width: 420px;
        margin: 0;
        color: var(--cdp-muted);
        font-size: 13px;
        line-height: 1.7;
      }

      /* =====================================================
         PAGINAÇÃO
         ===================================================== */

      .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 36px;
      }

      .pagination[hidden] {
        display: none;
      }

      .pagination button,
      .pagination a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 40px;
        height: 40px;
        padding: 0 13px;
        border: 1px solid #333333;
        border-radius: 8px;
        background: #191919;
        color: #dddddd;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .pagination button:hover:not(:disabled),
      .pagination a:hover {
        border-color: var(--cdp-yellow);
        color: var(--cdp-yellow);
      }

      .pagination button.active,
      .pagination a.active {
        border-color: var(--cdp-yellow);
        background: var(--cdp-yellow);
        color: #141414;
      }

      .pagination button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* =====================================================
         RESPONSIVIDADE
         ===================================================== */

      @media (max-width: 960px) {
        .cardapio-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 18px;
        }

        .cardapio-grid img {
          height: 190px;
        }
      }

      @media (max-width: 600px) {
        .page-header {
          padding: 18px 15px 16px;
        }

        .page-header-top {
          margin-bottom: 25px;
        }

        .page-title {
          font-size: clamp(38px, 11vw, 52px);
        }

        .page-subtitle {
          max-width: 420px;
          font-size: 12px;
          line-height: 1.7;
        }

        .categorias-filtro {
          padding: 10px 14px 18px;
        }

        .categorias-scroll {
          justify-content: flex-start;
          flex-wrap: nowrap;
          overflow-x: auto;
          padding: 2px 1px 9px;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: thin;
          scrollbar-color: #555 transparent;
        }

        .categorias-scroll button,
        .categorias-scroll .categoria-btn {
          flex-shrink: 0;
          min-height: 39px;
          padding: 9px 15px;
          font-size: 10px;
        }

        .cardapio-main {
          padding: 8px 14px 110px;
        }

        .cardapio-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
        }

        .cardapio-grid > article,
        .cardapio-grid > div,
        .cardapio-grid .produto-card,
        .cardapio-grid .card-produto {
          gap: 10px;
          padding: 10px;
          border-radius: 10px;
        }

        .cardapio-grid img {
          height: 145px;
          padding: 5px;
        }

        .cardapio-grid h2,
        .cardapio-grid h3 {
          font-size: 18px;
        }

        .cardapio-grid p {
          font-size: 10px;
          line-height: 1.5;
        }

        .cardapio-grid strong,
        .cardapio-grid .preco,
        .cardapio-grid [class*="preco"] {
          font-size: 15px;
        }

        .cardapio-grid button,
        .cardapio-grid .btn,
        .cardapio-grid a[class*="btn"] {
          min-height: 38px;
          padding: 9px 7px;
          font-size: 9px;
          letter-spacing: 0.02em;
        }

        .empty-state {
          padding: 45px 18px;
        }
      }

      @media (max-width: 360px) {
        .cardapio-grid {
          grid-template-columns: minmax(0, 1fr);
        }

        .cardapio-grid img {
          height: 190px;
        }

        .cardapio-grid h2,
        .cardapio-grid h3 {
          font-size: 21px;
        }

        .cardapio-grid p {
          font-size: 12px;
        }
      }

      /* =====================================================
         ACESSIBILIDADE
         ===================================================== */

      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--cdp-yellow);
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto;
          transition-duration: 0.01ms;
          animation-duration: 0.01ms;
        }
      }
    </style>
  <style>

/* CENTRAL DE NOTIFICAÇÕES */
.fraga-notificacao {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin: 0 12px;
    z-index: 9999;
}

.fraga-sino {
    position: relative;
    width: 42px;
    height: 42px;
    border: 1px solid #333;
    border-radius: 50%;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
    font-size: 21px;
}

.fraga-sino:hover {
    background: #292929;
}

.fraga-contador {
    position: absolute;
    top: -4px;
    right: -5px;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    border-radius: 20px;
    background: #e53935;
    color: white;
    font-size: 10px;
    font-weight: bold;
    display: none;
    align-items: center;
    justify-content: center;
}

.fraga-painel-notificacoes {
    position: absolute;
    top: 50px;
    right: 0;
    width: 340px;
    max-width: calc(100vw - 30px);
    max-height: 420px;
    overflow-y: auto;
    background: #171717;
    color: #fff;
    border: 1px solid #333;
    border-radius: 12px;
    box-shadow: 0 8px 30px #0008;
    display: none;
    z-index: 10000;
}

.fraga-painel-notificacoes.aberto {
    display: block;
}

.fraga-notificacoes-topo {
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #333;
}

.fraga-notificacoes-topo strong {
    font-size: 14px;
}

.fraga-marcar-todas {
    background: none;
    border: none;
    color: #44b7f8;
    cursor: pointer;
    font-size: 11px;
}

.fraga-notificacao-item {
    padding: 13px 15px;
    border-bottom: 1px solid #292929;
    cursor: pointer;
}

.fraga-notificacao-item:hover {
    background: #242424;
}

.fraga-notificacao-item.nao-lida {
    border-left: 3px solid #44b7f8;
    background: #202a30;
}

.fraga-notificacao-item strong {
    display: block;
    font-size: 13px;
    margin-bottom: 5px;
}

.fraga-notificacao-item p {
    font-size: 12px;
    color: #ccc;
    margin: 0 0 6px;
}

.fraga-notificacao-item small {
    font-size: 10px;
    color: #888;
}

.fraga-notificacao-vazia {
    padding: 25px 15px;
    text-align: center;
    color: #999;
    font-size: 13px;
}

@media(max-width: 480px) {
    .fraga-painel-notificacoes {
        position: fixed;
        top: 75px;
        right: 10px;
    }
}

</style>
    <link rel="stylesheet" href="/responsive.css" />
  </head>

  <body>
    <!-- AVISO DE ESTABELECIMENTO FECHADO -->
    <div
      id="closedBanner"
      class="closed-banner hidden"
      role="alert"
      aria-live="assertive"
    >
      <div class="closed-banner-content">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>

        <div class="closed-banner-text">
          <strong>ESTABELECIMENTO FECHADO</strong>
          <span id="closedBannerMessage">
            Carregando horário de funcionamento...
          </span>
        </div>
      </div>
    </div>

    <!-- CABEÇALHO -->
    <section class="page-header">
      <div class="page-header-top">
        <a href="/cliente/painel.html" class="btn-voltar-painel">
          <span aria-hidden="true">←</span>
          Voltar ao painel
        </a>
      </div>

      <div class="page-header-inner">
        <h1 class="page-title">NOSSO <span class="accent">CARDÁPIO</span></h1>

        <p class="page-subtitle">
          Hambúrgueres artesanais, marmitas, porções e bebidas preparados com
          ingredientes selecionados.
        </p>

        <div class="yellow-line"></div>
      </div>
    </section>

    <!-- FILTROS -->
    <section class="categorias-filtro" aria-label="Filtrar por categoria">
      <div class="container">
        <div
          class="categorias-scroll"
          id="categoriasFiltro"
          role="tablist"
          aria-label="Categorias do cardápio"
        ></div>
      </div>
    </section>

    <!-- PRODUTOS -->
    <main class="cardapio-main">
      <div class="container">
        <div
          class="cardapio-grid"
          id="cardapioGrid"
          role="list"
          aria-label="Produtos do cardápio"
        ></div>

        <!-- ESTADO VAZIO -->
        <div class="empty-state hidden" id="emptyState">
          <div class="empty-state-icon">
            <svg
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>

          <h2 class="empty-state-title">Nenhum produto encontrado</h2>

          <p class="empty-state-message">
            Não há produtos disponíveis nesta categoria no momento.
          </p>
        </div>

        <!-- PAGINAÇÃO -->
        <nav
          class="pagination"
          id="pagination"
          aria-label="Paginação do cardápio"
          hidden
        ></nav>
      </div>
    </main>

    <!-- SCRIPTS ORIGINAIS -->
    <script src="/cliente/cardapio.js" defer></script>
    <script src="/cliente/carrinho-widget.js" defer></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .catch((erro) =>
              console.error("Erro ao registrar Service Worker:", erro),
            );
        });
      }
    </script>
  </body>
</html>
