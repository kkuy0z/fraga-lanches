<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Fraga Lanches" />

    <title>Cardápio - Fraga Lanches</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/imagens/logo.png" />
    <link rel="apple-touch-icon" href="/imagens/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@400;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/design-system.css" />

    <style>
      /* =====================================================
         FRAGA LANCHES — CARDÁPIO (IDENTIDADE & LAYOUT)
         ===================================================== */

      :root {
        --cdp-bg: #0c0c0c;
        --cdp-card: #191919;
        --cdp-card-hover: #1f1f1f;
        --cdp-border: rgba(255, 255, 255, 0.09);
        --cdp-yellow: #f5c542;
        --cdp-yellow-hover: #ffda65;
        --cdp-text: #f5f5f5;
        --cdp-muted: #a5a5a5;
        --cdp-input: #111111;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        width: 100%;
        max-width: 100%;
        overflow-x: clip;
        scroll-behavior: smooth;
      }

      body {
        display: block;
        width: 100%;
        max-width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        overflow-x: clip;
        background:
          radial-gradient(
            circle at 15% 8%,
            rgba(245, 197, 66, 0.08),
            transparent 42%
          ),
          radial-gradient(
            circle at 85% 88%,
            rgba(245, 197, 66, 0.05),
            transparent 40%
          ),
          var(--cdp-bg);
        color: var(--cdp-text);
        font-family: "Montserrat", sans-serif;
      }

      /* Anula min-height: 100vh de section do design-system.css */
      body section {
        position: static;
        min-height: 0;
        height: auto;
      }

      button,
      a,
      input,
      select {
        font: inherit;
      }

      /* =====================================================
         BANNER ESTABELECIMENTO FECHADO
         ===================================================== */

      .closed-banner {
        width: 100%;
        background: linear-gradient(
          90deg,
          rgba(245, 197, 66, 0.14),
          rgba(255, 107, 107, 0.14)
        );
        border-bottom: 1px solid rgba(245, 197, 66, 0.35);
      }

      .closed-banner.hidden {
        display: none;
      }

      .closed-banner-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        max-width: 1200px;
        margin: 0 auto;
        padding: 12px 20px;
        color: var(--cdp-yellow);
        text-align: left;
      }

      .closed-banner-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .closed-banner-text strong {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .closed-banner-text span {
        color: #e6e6e6;
        font-size: 12px;
      }

      /* =====================================================
         CABEÇALHO DO CARDÁPIO
         ===================================================== */

      .page-header {
        display: block;
        width: 100%;
        max-width: 100%;
        min-height: 0;
        margin: 0 auto;
        padding: 20px 20px 14px;
        background: transparent;
        border: 0;
        text-align: center;
      }

      .page-header-top {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto 12px;
      }

      .btn-voltar-painel {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border: 1px solid #323232;
        border-radius: 999px;
        background-color: var(--cdp-card);
        color: #e6e6e6;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease,
          transform 0.2s ease;
      }

      .btn-voltar-painel:hover {
        border-color: rgba(245, 197, 66, 0.55);
        color: var(--cdp-yellow);
        transform: translateY(-1px);
      }

      .page-header-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 920px;
        margin: 0 auto;
        text-align: center;
      }

      .page-title {
        display: block;
        width: 100%;
        margin: 0 0 8px;
        padding: 0;
        color: #ffffff;
        font-family: "Anton", sans-serif;
        font-size: clamp(40px, 5.2vw, 60px);
        font-weight: 400;
        line-height: 1.04;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        text-align: center;
      }

      .page-title .accent {
        color: var(--cdp-yellow);
      }

      .page-subtitle {
        display: block;
        width: 100%;
        max-width: 580px;
        margin: 0 auto;
        padding: 0;
        color: var(--cdp-muted);
        font-size: 13px;
        font-weight: 400;
        line-height: 1.55;
        text-align: center;
      }

      .yellow-line {
        display: block;
        width: 64px;
        height: 3px;
        margin: 14px auto 0;
        border-radius: 999px;
        background-color: var(--cdp-yellow);
      }

      /* =====================================================
         FILTRO DE CATEGORIAS
         ===================================================== */

      .categorias-filtro {
        width: 100%;
        padding: 10px 20px 18px;
      }

      .categorias-filtro .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0;
      }

      .categorias-scroll {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .categorias-scroll button,
      .categorias-scroll .categoria-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 38px;
        padding: 8px 16px;
        border: 1px solid #323232;
        border-radius: 999px;
        background-color: var(--cdp-card);
        color: #dcdcdc;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease,
          transform 0.2s ease;
      }

      .categorias-scroll button:hover,
      .categorias-scroll .categoria-btn:hover {
        border-color: rgba(245, 197, 66, 0.5);
        color: var(--cdp-yellow);
        transform: translateY(-1px);
      }

      .categorias-scroll button.active,
      .categorias-scroll button[aria-selected="true"],
      .categorias-scroll .categoria-btn.active {
        border-color: var(--cdp-yellow);
        background-color: var(--cdp-yellow);
        color: #141414;
        font-weight: 700;
      }

      /* =====================================================
         ÁREA PRINCIPAL & GRID DE PRODUTOS
         ===================================================== */

      .cardapio-main {
        width: 100%;
        padding: 8px 20px 96px;
      }

      .cardapio-main > .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0;
      }

      .cardapio-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }

      .cardapio-grid > * {
        min-width: 0;
      }

      /* Estado vazio */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px 24px;
        margin-top: 12px;
        border: 1px solid #2c2c2c;
        border-radius: 12px;
        background-color: var(--cdp-card);
      }

      .empty-state.hidden {
        display: none;
      }

      .empty-state-icon {
        display: inline-flex;
        width: 64px;
        height: 64px;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        border-radius: 50%;
        background-color: rgba(245, 197, 66, 0.1);
        border: 1px solid rgba(245, 197, 66, 0.28);
        color: var(--cdp-yellow);
      }

      .empty-state-title {
        margin: 0 0 8px;
        color: #ffffff;
        font-family: "Anton", sans-serif;
        font-size: 26px;
        font-weight: 400;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .empty-state-message {
        max-width: 420px;
        margin: 0;
        color: var(--cdp-muted);
        font-size: 13px;
        line-height: 1.6;
      }

      /* Paginação */
      .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 32px;
      }

      .pagination[hidden] {
        display: none;
      }

      .pagination button,
      .pagination a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 38px;
        height: 38px;
        padding: 0 12px;
        border: 1px solid #323232;
        border-radius: 8px;
        background-color: var(--cdp-card);
        color: #e4e4e4;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease;
      }

      .pagination button:hover:not(:disabled),
      .pagination a:hover {
        border-color: var(--cdp-yellow);
        color: var(--cdp-yellow);
      }

      .pagination button.active,
      .pagination a.active {
        border-color: var(--cdp-yellow);
        background-color: var(--cdp-yellow);
        color: #141414;
        font-weight: 700;
      }

      .pagination button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* =====================================================
         CARDS DE PRODUTOS DO CARDÁPIO (#cardapioGrid)
         ===================================================== */

      .cardapio-grid > article,
      .cardapio-grid > div,
      .cardapio-grid .produto-card,
      .cardapio-grid .card-produto {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 14px;
        padding: 16px;
        border: 1px solid #2e2e2e;
        border-radius: 12px;
        background-color: #191919;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
        transition:
          border-color 0.2s ease,
          transform 0.2s ease;
      }

      .cardapio-grid > article:hover,
      .cardapio-grid > div:hover,
      .cardapio-grid .produto-card:hover,
      .cardapio-grid .card-produto:hover {
        border-color: rgba(245, 197, 66, 0.45);
        transform: translateY(-2px);
      }

      .cardapio-grid img {
        display: block;
        width: 100%;
        height: 190px;
        object-fit: contain;
        padding: 10px;
        border-radius: 8px;
        background-color: #121212;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .cardapio-grid h2,
      .cardapio-grid h3 {
        margin: 0;
        color: #ffffff;
        font-family: "Anton", sans-serif;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        line-height: 1.15;
      }

      .cardapio-grid p {
        margin: 0;
        color: #a5a5a5;
        font-size: 12px;
        line-height: 1.5;
      }

      .cardapio-grid strong,
      .cardapio-grid .preco,
      .cardapio-grid [class*="preco"] {
        color: #f5c542;
        font-size: 16px;
        font-weight: 700;
      }

      .cardapio-grid button,
      .cardapio-grid .btn,
      .cardapio-grid a[class*="btn"] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 40px;
        margin-top: auto;
        padding: 10px 16px;
        border: 1px solid #f5c542;
        border-radius: 8px;
        background-color: #f5c542;
        color: #141414;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease,
          transform 0.2s ease;
      }

      .cardapio-grid button:hover,
      .cardapio-grid .btn:hover,
      .cardapio-grid a[class*="btn"]:hover {
        border-color: #ffda65;
        background-color: #ffda65;
      }

      /* =====================================================
         RESPONSIVIDADE
         ===================================================== */

      @media (max-width: 960px) {
        .cardapio-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px;
        }
      }

      @media (max-width: 600px) {
        .page-header {
          padding: 16px 14px 10px;
        }

        .page-subtitle {
          font-size: 12px;
        }

        .categorias-filtro {
          padding: 8px 14px 14px;
        }

        .categorias-scroll {
          justify-content: flex-start;
          flex-wrap: nowrap;
          overflow-x: auto;
          padding-bottom: 6px;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: thin;
        }

        .categorias-scroll button,
        .categorias-scroll .categoria-btn {
          flex-shrink: 0;
        }

        .cardapio-main {
          padding: 6px 14px 104px;
        }

        .cardapio-grid {
          grid-template-columns: minmax(0, 1fr);
          gap: 14px;
        }
      }

      /* =====================================================
         ACESSIBILIDADE
         ===================================================== */

      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--cdp-yellow);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto;
          transition-duration: 0.01ms;
          animation-duration: 0.01ms;
        }
      }
    </style>
  </head>

  <body>
    <div
      id="closedBanner"
      class="closed-banner hidden"
      role="alert"
      aria-live="assertive"
    >
      <div class="closed-banner-content">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>

        <div class="closed-banner-text">
          <strong>ESTABELECIMENTO FECHADO</strong>
          <span id="closedBannerMessage">
            Carregando horário de funcionamento...
          </span>
        </div>
      </div>
    </div>

    <section class="page-header">
      <div class="page-header-top">
        <a href="/cliente/painel.html" class="btn-voltar-painel">
          ← Voltar ao painel
        </a>
      </div>

      <div class="page-header-inner">
        <h1 class="page-title">NOSSO <span class="accent">CARDÁPIO</span></h1>

        <p class="page-subtitle">
          Hambúrgueres artesanais, marmitas, porções e bebidas preparados com
          ingredientes selecionados
        </p>

        <div class="yellow-line"></div>
      </div>
    </section>

    <section class="categorias-filtro" aria-label="Filtrar por categoria">
      <div class="container">
        <div
          class="categorias-scroll"
          id="categoriasFiltro"
          role="tablist"
          aria-label="Categorias do cardápio"
        ></div>
      </div>
    </section>

    <main class="cardapio-main" role="main">
      <div class="container">
        <div
          class="cardapio-grid"
          id="cardapioGrid"
          role="list"
          aria-label="Produtos do cardápio"
        ></div>

        <div class="empty-state hidden" id="emptyState">
          <div class="empty-state-icon">
            <svg
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>

          <h2 class="empty-state-title">Nenhum produto encontrado</h2>

          <p class="empty-state-message">
            Não há produtos disponíveis nesta categoria no momento.
          </p>
        </div>

        <nav
          class="pagination"
          id="pagination"
          aria-label="Paginação do cardápio"
          hidden
        ></nav>
      </div>
    </main>

    <script src="/cliente/cardapio.js" defer></script>
    <script src="/cliente/carrinho-widget.js" defer></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .catch((erro) =>
              console.error("Erro ao registrar Service Worker:", erro),
            );
        });
      }
    </script>
  </body>
</html>
