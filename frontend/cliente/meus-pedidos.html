<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Fraga Lanches" />

    <title>Meus Pedidos - Fraga Lanches</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/imagens/logo.png" />
    <link rel="apple-touch-icon" href="/imagens/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@400;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/design-system.css" />

    <style>
      :root {
        --ped-bg: #0c0c0c;
        --ped-card: #191919;
        --ped-border: rgba(255, 255, 255, 0.09);
        --ped-yellow: #f5c542;
        --ped-yellow-hover: #ffda65;
        --ped-text: #f5f5f5;
        --ped-muted: #a5a5a5;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        width: 100%;
        overflow-x: clip;
      }

      body {
        display: block;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        overflow-x: clip;
        background:
          radial-gradient(
            circle at 15% 8%,
            rgba(245, 197, 66, 0.08),
            transparent 42%
          ),
          radial-gradient(
            circle at 85% 88%,
            rgba(245, 197, 66, 0.05),
            transparent 40%
          ),
          var(--ped-bg);
        color: var(--ped-text);
        font-family: "Montserrat", sans-serif;
      }

      body section {
        position: static;
        min-height: 0;
        height: auto;
      }

      .hidden {
        display: none !important;
      }

      .page-main {
        width: 100%;
        padding: 20px 20px 104px;
      }

      .page-main > .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0;
      }

      /* CABEÇALHO */
      .page-header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: nowrap;
        gap: 10px;
        width: 100%;
        margin: 0 auto 14px;
      }

      .btn-voltar-painel {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px 14px;
        border: 1px solid #323232;
        border-radius: 999px;
        background-color: var(--ped-card);
        color: #e6e6e6;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
        transition:
          border-color 0.2s ease,
          color 0.2s ease,
          transform 0.2s ease;
      }

      .btn-voltar-painel:hover {
        border-color: rgba(245, 197, 66, 0.55);
        color: var(--ped-yellow);
        transform: translateY(-1px);
      }

      .page-header {
        padding: 8px 0 24px;
        text-align: center;
      }

      .page-title {
        margin: 0 0 8px;
        color: #ffffff;
        font-family: "Anton", sans-serif;
        font-size: clamp(36px, 5vw, 56px);
        font-weight: 400;
        line-height: 1.04;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .page-title .accent {
        color: var(--ped-yellow);
      }

      .page-subtitle {
        max-width: 560px;
        margin: 0 auto;
        color: var(--ped-muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .yellow-line {
        width: 64px;
        height: 3px;
        margin: 14px auto 0;
        border-radius: 999px;
        background-color: var(--ped-yellow);
      }

      /* FILTROS */
      .admin-filters {
        padding: 16px;
        margin-bottom: 20px;
        border: 1px solid #2b2b2b;
        border-radius: 12px;
        background-color: var(--ped-card);
      }

      .filter-group {
        display: flex;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 14px;
        width: 100%;
      }

      #btnLimparFiltros {
        margin-left: auto;
      }

      .form-row {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-label {
        color: var(--ped-muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .form-select,
      .form-input {
        min-height: 40px;
        padding: 8px 12px;
        border: 1px solid #333333;
        border-radius: 8px;
        background-color: #121212;
        color: #f5f5f5;
        font-family: "Montserrat", sans-serif;
        font-size: 13px;
      }

      .form-select:focus,
      .form-input:focus {
        outline: none;
        border-color: var(--ped-yellow);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 9px 16px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease,
          transform 0.2s ease;
      }

      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .btn-primary {
        border: 1px solid var(--ped-yellow);
        background-color: var(--ped-yellow);
        color: #141414;
      }

      .btn-primary:hover:not(:disabled) {
        border-color: var(--ped-yellow-hover);
        background-color: var(--ped-yellow-hover);
      }

      .btn-secondary {
        border: 1px solid #383838;
        background-color: #141414;
        color: #e5e5e5;
      }

      .btn-secondary:hover:not(:disabled) {
        border-color: var(--ped-yellow);
        color: var(--ped-yellow);
      }

      .btn-danger {
        border: 1px solid rgba(248, 113, 113, 0.45);
        background-color: rgba(248, 113, 113, 0.14);
        color: #fca5a5;
      }

      .btn-danger:hover:not(:disabled) {
        border-color: #f87171;
        background-color: #dc2626;
        color: #ffffff;
      }

      /* TABELA */
      .admin-table-section {
        border: 1px solid #2b2b2b;
        border-radius: 12px;
        background-color: var(--ped-card);
        overflow: hidden;
      }

      .table-container {
        width: 100%;
        overflow-x: auto;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      .table th {
        padding: 14px 16px;
        border-bottom: 1px solid #2f2f2f;
        background-color: #141414;
        color: var(--ped-yellow);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .table td {
        padding: 14px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        color: #eaeaea;
        font-size: 13px;
        vertical-align: middle;
      }

      .table tbody tr:last-child td {
        border-bottom: none;
      }

      .table tbody tr:hover {
        background-color: rgba(255, 255, 255, 0.02);
      }

      /* ESTADO VAZIO */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px 24px;
        margin-top: 16px;
        border: 1px solid #2c2c2c;
        border-radius: 12px;
        background-color: var(--ped-card);
      }

      .empty-state.hidden {
        display: none;
      }

      .empty-state-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
        border-radius: 50%;
        background-color: rgba(245, 197, 66, 0.1);
        border: 1px solid rgba(245, 197, 66, 0.28);
        color: var(--ped-yellow);
      }

      .empty-state-title {
        margin: 0 0 8px;
        color: #ffffff;
        font-family: "Anton", sans-serif;
        font-size: 26px;
        font-weight: 400;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .empty-state-message {
        max-width: 420px;
        margin: 0 0 18px;
        color: var(--ped-muted);
        font-size: 13px;
        line-height: 1.6;
      }

      /* MODAL */
      #pedidoModal.modal-overlay {
        position: fixed !important;
        inset: 0 !important;
        z-index: 999999 !important;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100% !important;
        height: 100% !important;
        min-height: 100vh !important;
        padding: 16px;
        background:
          radial-gradient(
            circle at 50% 25%,
            rgba(245, 197, 66, 0.09),
            transparent 55%
          ),
          rgba(0, 0, 0, 0.82) !important;
        backdrop-filter: blur(6px);
        visibility: visible;
        opacity: 1;
      }

      #pedidoModal.modal-overlay.hidden {
        display: none !important;
      }

      #pedidoModal .modal {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 580px;
        max-height: 86vh;
        max-height: 86dvh;
        overflow: hidden;
        border: 1px solid rgba(245, 197, 66, 0.25);
        border-radius: 16px;
        background-color: #161616;
        color: var(--ped-text);
        box-shadow:
          0 24px 64px rgba(0, 0, 0, 0.85),
          0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      #pedidoModal .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 22px;
        border-bottom: 1px solid rgba(245, 197, 66, 0.16);
        background: linear-gradient(180deg, #1d1d1d 0%, #141414 100%);
      }

      #pedidoModal .modal-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        color: #ffffff;
        font-family: "Anton", sans-serif;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      #pedidoModal .modal-title::before {
        content: "";
        display: inline-block;
        width: 4px;
        height: 20px;
        border-radius: 999px;
        background-color: var(--ped-yellow);
      }

      #pedidoModal .modal-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        width: 34px;
        height: 34px;
        border: 1px solid #353535;
        border-radius: 10px;
        background-color: #202020;
        color: #e4e4e4;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease,
          transform 0.2s ease;
      }

      #pedidoModal .modal-close:hover {
        border-color: var(--ped-yellow);
        background-color: rgba(245, 197, 66, 0.12);
        color: var(--ped-yellow);
        transform: scale(1.04);
      }

      #pedidoModal .modal-body {
        display: block;
        flex: 1 1 auto;
        padding: 20px 22px;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.6;
        scrollbar-width: thin;
        scrollbar-color: #3a3a3a transparent;
      }

      #pedidoModal .modal-body::-webkit-scrollbar {
        width: 6px;
      }

      #pedidoModal .modal-body::-webkit-scrollbar-thumb {
        background-color: #3a3a3a;
        border-radius: 999px;
      }

      #pedidoModal .pedido-detalhes {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
      }

      #pedidoModal .pedido-detalhes section {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 14px 16px;
        border: 1px solid #2b2b2b;
        border-radius: 12px;
        background-color: #1c1c1c;
      }

      #pedidoModal .pedido-detalhes h3 {
        display: block !important;
        width: 100%;
        margin: 0 0 10px !important;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--ped-yellow);
        font-family: "Anton", sans-serif;
        font-size: 17px;
        font-weight: 400;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-align: left;
      }

      #pedidoModal .pedido-detalhes p {
        display: block !important;
        width: 100%;
        margin: 5px 0 !important;
        color: #e4e4e4;
        font-size: 13px;
        line-height: 1.5;
        text-align: left;
      }

      #pedidoModal .pedido-detalhes section:last-child h3:last-child {
        margin-top: 10px !important;
        margin-bottom: 0 !important;
        padding-top: 10px;
        padding-bottom: 0;
        border-top: 1px dashed rgba(245, 197, 66, 0.35);
        border-bottom: none;
        font-size: 20px;
        color: var(--ped-yellow);
      }

      #pedidoModal .pedido-item {
        display: flex !important;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        width: 100%;
        padding: 10px 0 !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07) !important;
      }

      #pedidoModal .pedido-item:last-child {
        border-bottom: none !important;
        padding-bottom: 0 !important;
      }

      #pedidoModal .modal-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 10px;
        padding: 14px 22px;
        border-top: 1px solid var(--ped-border);
        background-color: #141414;
      }

      #pedidoModal .modal-footer .btn-secondary {
        min-width: 110px;
        border-color: rgba(245, 197, 66, 0.45);
        background-color: #202020;
        color: var(--ped-yellow);
      }

      #pedidoModal .modal-footer .btn-secondary:hover:not(:disabled) {
        border-color: var(--ped-yellow-hover);
        background-color: var(--ped-yellow);
        color: #141414;
      }

      /* CENTRAL DE NOTIFICAÇÕES */
      .fraga-notificacao {
        position: relative !important;
        top: auto !important;
        right: auto !important;
        left: auto !important;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin: 0;
        z-index: 100;
      }

      .fraga-sino {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        width: 42px;
        height: 42px;
        border: 1px solid #333;
        border-radius: 50%;
        background: #1a1a1a;
        color: #fff;
        cursor: pointer;
        font-size: 21px;
      }

      .fraga-sino:hover {
        background: #292929;
      }

      .fraga-contador {
        position: absolute;
        top: -4px;
        right: -5px;
        display: none;
        align-items: center;
        justify-content: center;
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        border-radius: 20px;
        background: #e53935;
        color: white;
        font-size: 10px;
        font-weight: bold;
      }

      .fraga-painel-notificacoes {
        position: absolute !important;
        top: calc(100% + 8px) !important;
        right: 0 !important;
        left: auto !important;
        width: 340px;
        max-width: calc(100vw - 28px);
        max-height: 420px;
        overflow-y: auto;
        background: #171717;
        color: #fff;
        border: 1px solid #333;
        border-radius: 12px;
        box-shadow: 0 8px 30px #0008;
        display: none;
        z-index: 10000;
      }

      .fraga-painel-notificacoes.aberto {
        display: block;
      }

      .fraga-notificacoes-topo {
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #333;
      }

      .fraga-notificacoes-topo strong {
        font-size: 14px;
      }

      .fraga-marcar-todas {
        background: none;
        border: none;
        color: #44b7f8;
        cursor: pointer;
        font-size: 11px;
      }

      .fraga-notificacao-item {
        padding: 13px 15px;
        border-bottom: 1px solid #292929;
        cursor: pointer;
      }

      .fraga-notificacao-item:hover {
        background: #242424;
      }

      .fraga-notificacao-item.nao-lida {
        border-left: 3px solid #44b7f8;
        background: #202a30;
      }

      .fraga-notificacao-item strong {
        display: block;
        font-size: 13px;
        margin-bottom: 5px;
      }

      .fraga-notificacao-item p {
        font-size: 12px;
        color: #ccc;
        margin: 0 0 6px;
      }

      .fraga-notificacao-item small {
        font-size: 10px;
        color: #888;
      }

      .fraga-notificacao-vazia {
        padding: 25px 15px;
        text-align: center;
        color: #999;
        font-size: 13px;
      }

      /* Agrupamento do botão de cardápio com o sino */
      .page-header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        gap: 12px;
      }

      .page-header-right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        flex-shrink: 0;
      }

      .page-header-right .btn-voltar-painel {
        white-space: nowrap;
      }

      .fraga-notificacao {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin: 0;
        z-index: 100;
      }

      .fraga-painel-notificacoes {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        width: 340px;
        max-width: calc(100vw - 28px);
        max-height: 420px;
        overflow-y: auto;
        z-index: 10000;
      }

      @media (max-width: 640px) {
        .page-header-top {
          gap: 8px;
        }

        .page-header-right {
          gap: 7px;
        }

        .btn-voltar-painel {
          padding: 8px 10px;
          font-size: 10px;
        }

        .fraga-sino {
          width: 38px;
          height: 38px;
        }
      }

      @media (max-width: 360px) {
        .page-header-top {
          gap: 5px;
        }

        .page-header-right {
          gap: 5px;
        }

        .btn-voltar-painel {
          padding: 7px 8px;
          font-size: 9px;
        }
      }
      /* RESPONSIVIDADE */
      @media (max-width: 820px) {
        #btnLimparFiltros {
          margin-left: 0;
          width: 100%;
        }
      }

      @media (max-width: 640px) {
        .page-main {
          padding: 16px 14px 104px;
        }

        .filter-group,
        .form-row {
          flex-direction: column;
          align-items: stretch;
        }

        .page-header-top {
          flex-wrap: nowrap;
          justify-content: space-between;
          gap: 8px;
        }

        .page-header-top > a {
          white-space: nowrap;
        }

        #pedidoModal.modal-overlay {
          padding: 10px;
        }

        #pedidoModal .modal {
          max-height: 90vh;
          max-height: 90dvh;
          border-radius: 14px;
        }

        #pedidoModal .modal-header,
        #pedidoModal .modal-body,
        #pedidoModal .modal-footer {
          padding: 14px 16px;
        }

        .fraga-painel-notificacoes {
          max-width: min(340px, calc(100vw - 28px));
        }
      }

      @media (max-width: 380px) {
        .page-header-top {
          gap: 6px;
        }

        .btn-voltar-painel {
          padding: 8px 9px;
          font-size: 10px;
        }

        .fraga-sino {
          width: 38px;
          height: 38px;
          font-size: 19px;
        }
      }
    </style>
      <link rel="stylesheet" href="/responsive.css" />
  </head>

  <body>
    <main class="page-main" role="main">
      <div class="container">
        <div class="page-header-top">
          <a href="/cliente/painel.html" class="btn-voltar-painel">
            ← Voltar ao painel
          </a>

          <a href="/cliente/cardapio.html" class="btn-voltar-painel">
            Ver cardápio →
          </a>
        </div>

        <div class="page-header">
          <div class="page-header-inner">
            <h1 class="page-title">Meus <span class="accent">Pedidos</span></h1>

            <p class="page-subtitle">
              Acompanhe o histórico e status dos seus pedidos
            </p>

            <div class="yellow-line"></div>
          </div>
        </div>

        <!-- Filtros -->
        <div class="admin-filters">
          <div class="filter-group">
            <div class="form-group" style="min-width: 190px">
              <label for="filtroStatus" class="form-label">Status</label>

              <select
                id="filtroStatus"
                class="form-select"
                aria-label="Filtrar por status"
              >
                <option value="">Todos os status</option>
                <option value="novo">Novo</option>
                <option value="em_preparo">Em preparo</option>
                <option value="pronto">Pronto</option>
                <option value="saiu_para_entrega">Saiu para entrega</option>
                <option value="concluido">Concluído</option>
                <option value="cancelado">Cancelado</option>
              </select>
            </div>

            <div class="form-row">
              <div class="form-group" style="min-width: 155px">
                <label for="dataInicio" class="form-label">
                  Data inicial
                </label>
                <input type="date" id="dataInicio" class="form-input" />
              </div>

              <div class="form-group" style="min-width: 155px">
                <label for="dataFim" class="form-label">Data final</label>
                <input type="date" id="dataFim" class="form-input" />
              </div>
            </div>

            <button
              type="button"
              class="btn btn-secondary"
              id="btnLimparFiltros"
            >
              Limpar Filtros
            </button>
          </div>
        </div>

        <!-- Tabela -->
        <section class="admin-table-section" aria-label="Lista de pedidos">
          <div class="table-container">
            <table class="table" id="tabelaPedidos">
              <thead>
                <tr>
                  <th>Pedido</th>
                  <th>Data</th>
                  <th>Status</th>
                  <th>Itens</th>
                  <th>Total</th>
                  <th>Ações</th>
                </tr>
              </thead>

              <tbody id="tbodyPedidos">
                <tr>
                  <td colspan="6" style="text-align: center; padding: 24px">
                    Carregando pedidos...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <!-- Estado vazio -->
        <div class="empty-state hidden" id="emptyState">
          <div class="empty-state-icon">
            <svg
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </div>

          <h2 class="empty-state-title">Nenhum pedido encontrado</h2>

          <p class="empty-state-message">Você ainda não fez nenhum pedido.</p>

          <a href="/cliente/cardapio.html" class="btn btn-primary">
            Fazer um Pedido
          </a>
        </div>
      </div>
    </main>

    <!-- Modal de detalhes -->
    <div
      class="modal-overlay hidden"
      id="pedidoModal"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-labelledby="pedidoModalTitulo"
    >
      <div class="modal modal-lg">
        <div class="modal-header">
          <h2 class="modal-title" id="pedidoModalTitulo">Detalhes do Pedido</h2>

          <button
            type="button"
            class="modal-close"
            id="pedidoModalClose"
            aria-label="Fechar modal"
          >
            &times;
          </button>
        </div>

        <div class="modal-body" id="pedidoModalBody">
          Carregando detalhes...
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-danger hidden"
            id="pedidoModalCancelar"
          >
            Cancelar Pedido
          </button>

          <button
            type="button"
            class="btn btn-secondary"
            id="pedidoModalFechar"
          >
            Fechar
          </button>
        </div>
      </div>
    </div>

    <script src="/cliente/carrinho-widget.js" defer></script>
    <script src="/cliente/meus-pedidos.js" defer></script>
    <script src="/cliente/avaliacoes-pedidos.js" defer></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .catch((erro) =>
              console.error("Erro ao registrar Service Worker:", erro),
            );
        });
      }
    </script>
  </body>
</html>
