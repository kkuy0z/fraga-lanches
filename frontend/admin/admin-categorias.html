<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categorias | Fraga Lanches Admin</title>
    <link rel="manifest" href="/manifest.json">

    <link rel="icon" href="/assets/images/icons/logo.png">
    <link rel="apple-touch-icon" href="/assets/images/icons/logo.png">

    <meta name="theme-color" content="#0c0c0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fraga Lanches Admin">
    <meta name="referrer" content="strict-origin-when-cross-origin">
</head>

<body>

    <main class="page-main admin-main" role="main">

        <div class="container">

            <!-- Cabeçalho -->
            <div class="page-header">

                <div class="page-header-inner">

                    <div class="d-flex justify-between align-center">

                        <div>
                            <h1 class="page-title">Categorias</h1>

                            <p class="page-subtitle">
                                Gerencie as categorias do cardápio.
                            </p>
                        </div>

                        <button type="button" class="btn btn-primary" id="btnNovaCategoria">
                            <svg class="btn-icon" aria-hidden="true">
                                <use href="#i-add"></use>
                            </svg>

                            Nova Categoria
                        </button>

                    </div>

                    <div class="yellow-line"></div>

                </div>

            </div>

            <!-- Filtros -->
            <div class="admin-filters">

                <div class="filter-group">

                    <input type="search" id="buscaCategoria" class="form-input" placeholder="Buscar por nome..."
                        aria-label="Buscar categoria pelo nome">

                    <select id="filtroAtivo" class="form-select" aria-label="Filtrar categorias por status">
                        <option value="">Todas</option>
                        <option value="ativo">Ativas</option>
                        <option value="inativo">Inativas</option>
                    </select>

                </div>

            </div>

            <!-- Tabela -->
            <section class="admin-table-section" aria-label="Lista de categorias">

                <div class="table-container">

                    <table class="table" id="tabelaCategorias">

                        <thead>
                            <tr>
                                <th scope="col">Nome</th>
                                <th scope="col">Descrição</th>
                                <th scope="col">Status</th>
                                <th scope="col">Ações</th>
                            </tr>
                        </thead>

                        <tbody id="tbodyCategorias">

                            <tr>
                                <td colspan="4" class="text-center py-4">
                                    Carregando categorias...
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </div>

    </main>

    <!-- Modal cadastrar/editar -->
    <div class="modal-overlay hidden" id="categoriaModal" role="dialog" aria-modal="true"
        aria-labelledby="categoriaModalTitulo">

        <div class="modal modal-md">

            <div class="modal-header">

                <h2 class="modal-title" id="categoriaModalTitulo">
                    Nova Categoria
                </h2>

                <button type="button" class="modal-close" id="categoriaModalClose" aria-label="Fechar modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        aria-hidden="true">
                        <use href="#i-x"></use>
                    </svg>
                </button>

            </div>

            <form id="categoriaForm" class="modal-body" novalidate>

                <input type="hidden" id="categoriaId" name="id">

                <div class="form-group">

                    <label for="categoriaNome" class="form-label">
                        Nome *
                    </label>

                    <input type="text" id="categoriaNome" name="nome" class="form-input" required maxlength="80"
                        placeholder="Ex: Hambúrgueres, Bebidas, Sobremesas">

                </div>

                <div class="form-group">

                    <label for="categoriaDescricao" class="form-label">
                        Descrição
                    </label>

                    <textarea id="categoriaDescricao" name="descricao" class="form-textarea" rows="3" maxlength="255"
                        placeholder="Descrição breve da categoria"></textarea>

                </div>

                <div class="form-check">

                    <input type="checkbox" id="categoriaAtivo" name="ativo" class="form-check-input" checked>

                    <label for="categoriaAtivo" class="form-check-label">
                        Categoria ativa (visível no cardápio)
                    </label>

                </div>

            </form>

            <div class="modal-footer">

                <button type="button" class="btn btn-secondary" id="btnCancelarCategoria">
                    Cancelar
                </button>

                <button type="submit" form="categoriaForm" class="btn btn-primary" id="btnSalvarCategoria">
                    <svg class="btn-icon" aria-hidden="true">
                        <use href="#i-save"></use>
                    </svg>

                    Salvar Categoria
                </button>

            </div>

        </div>

    </div>

    <!-- Modal de exclusão -->
    <div class="modal-overlay hidden" id="deleteCategoriaModal" role="dialog" aria-modal="true"
        aria-labelledby="deleteCategoriaModalTitulo">

        <div class="modal modal-sm">

            <div class="modal-header">

                <h2 class="modal-title" id="deleteCategoriaModalTitulo">
                    Confirmar Exclusão
                </h2>

            </div>

            <div class="modal-body">

                <p>
                    Tem certeza que deseja excluir a categoria
                    <strong id="deleteCategoriaNome"></strong>?
                </p>

                <p class="form-help">
                    Categorias que possuem produtos vinculados não podem
                    ser excluídas. Nesse caso, desative a categoria.
                </p>

            </div>

            <div class="modal-footer">

                <button type="button" class="btn btn-secondary" id="btnCancelarDeleteCategoria">
                    Cancelar
                </button>

                <button type="button" class="btn btn-danger" id="btnConfirmarDeleteCategoria">
                    <svg class="btn-icon" aria-hidden="true">
                        <use href="#i-trash"></use>
                    </svg>

                    Excluir
                </button>

            </div>

        </div>

    </div>

    <script src="/admin/admin-categorias.js" defer></script>
</body>

</html>
