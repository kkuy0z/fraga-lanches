<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Administrativo | Fraga Lanches</title>

    <link rel="stylesheet" href="/design-system.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/frontend/imagens/logo.png">
    <link rel="apple-touch-icon" href="/frontend/imagens/logo.png">
    <link rel="stylesheet" href="/frontend/design-system.css">

    <meta name="theme-color" content="#0c0c0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fraga Lanches Admin">

    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self';">

    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">

    <script src="/admin/admin-login.js" defer></script>
</head>

<body>

    <main class="page-main">

        <div class="container">

            <div class="text-center">
                <a href="/inicio.html">
                    <img src="/frontend/imagens/logo.png" alt="Fraga Lanches" class="logo-img">
                </a>
            </div>

            <article class="card">

                <header class="text-center">
                    <h1 class="card-title">
                        Painel Administrativo
                    </h1>

                    <p>
                        Faça login para acessar o painel de controle.
                    </p>
                </header>

                <form id="formLogin" novalidate>

                    <div class="form-group">
                        <label for="email" class="form-label">
                            E-mail *
                        </label>

                        <input type="email" id="email" name="email" class="form-input" required autocomplete="username"
                            placeholder="admin@fragalanches.com">
                    </div>

                    <div class="form-group">
                        <label for="senha" class="form-label">
                            Senha *
                        </label>

                        <div class="input-with-icon">
                            <input type="password" id="senha" name="senha" class="form-input" required
                                autocomplete="current-password" placeholder="Digite sua senha">

                            <button type="button" class="input-icon-btn" id="toggleSenha" aria-label="Mostrar senha">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-check">
                            <input type="checkbox" id="lembrar" name="lembrar" class="form-check-input">

                            <span class="form-check-label">
                                Lembrar-me
                            </span>
                        </label>
                    </div>

                    <p id="mensagemLogin" role="alert" aria-live="polite"></p>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="btnLogin">
                        Entrar
                    </button>

                </form>

                <div class="text-center">
                    <p>Não é administrador?</p>

                    <a href="/inicio.html" class="btn btn-outline btn-block">
                        Voltar ao site
                    </a>
                </div>

            </article>

            <p class="text-center">
                © 2026 Fraga Lanches - Todos os direitos reservados.
            </p>

        </div>

    </main>

</body>

</html>
